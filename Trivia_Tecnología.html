<title>Trivia de Tecnología</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#18213a;--tx:#eef2ff;--mut:#9aa7c7;--pri:#748ffc;--ok:#51cf66;--bad:#ff6b6b;--bd:#2b3658}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#18213a;--tx:#eef2ff;--mut:#9aa7c7;--pri:#748ffc;--ok:#51cf66;--bad:#ff6b6b;--bd:#2b3658}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:640px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:24px;margin-top:12px}
h1{font-size:1.8rem;margin:0 0 6px}h2{margin:0 0 14px;font-size:1.3rem;line-height:1.35}
p{color:var(--mut);line-height:1.5}
input{width:100%;padding:12px;font-size:1rem;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:10px 0}
button{font:inherit;cursor:pointer}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:600;font-size:1rem}
.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.opt{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--bg))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--bg))}
.top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mut);margin-bottom:8px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar div{height:100%;background:var(--pri);width:100%;transition:width 1s linear}
.cat{display:inline-block;font-size:.75rem;background:var(--pri);color:#fff;border-radius:20px;padding:3px 10px;margin-bottom:10px}
.exp{margin-top:12px;font-size:.95rem}
.big{font-size:3rem;font-weight:800;color:var(--pri);margin:6px 0}
ol{padding-left:22px;line-height:1.8}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.hide{display:none}
body{background:radial-gradient(ellipse at top,#16224a,#070b17 70%) fixed}
#bg{position:fixed;inset:0;z-index:-1}
h1{background:linear-gradient(90deg,#22d3ee,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:rgba(18,26,50,.7);backdrop-filter:blur(10px);box-shadow:0 0 30px rgba(34,211,238,.12);border-color:rgba(34,211,238,.3);animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.ico{width:130px;height:130px;margin:0 auto 10px;filter:drop-shadow(0 0 14px rgba(34,211,238,.5));animation:fl 3s ease-in-out infinite}
.ico svg{width:100%;height:100%}
@keyframes fl{50%{transform:translateY(-8px) rotate(3deg)}}
.opt{transition:transform .15s,box-shadow .15s}.opt:hover:not(:disabled){transform:translateX(6px);box-shadow:0 0 14px rgba(34,211,238,.35)}
.opt.bad{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.big{text-shadow:0 0 20px var(--pri)}
#mute{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;padding:6px 12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.lv{flex:1;min-width:200px;opacity:.55;text-align:center}.lv small{font-weight:400;opacity:.9}.lv.on{opacity:1;box-shadow:0 0 18px var(--pri);outline:2px solid #fff}
h3{margin:14px 0 0}
</style>
</head>
<body>
<canvas id="bg"></canvas><button id="mute" class="btn sec">🔊</button>
<main>
<h1>💻 Trivia de Tecnología</h1>
<p>Semana de la Ciencia · Centro de Informática e Idiomas</p>

<section id="home" class="card">
  <div class="ico" id="homeIco"></div>
  <h2>¡Pon a prueba tu tecnología!</h2>
  <p>Elige tu nivel. Cada partida tiene 5 preguntas al azar de un banco de 30. Mientras más rápido respondas, más puntos ganas.</p>
  <div class="row"><button class="btn lv on" data-l="facil">🟢 Fácil · Secundaria<br><small>20 s por pregunta</small></button><button class="btn lv" data-l="dificil">🔴 Difícil · Universitarios y docentes<br><small>30 s por pregunta</small></button></div>
  <input id="name" placeholder="Tu nombre" maxlength="24" autocomplete="off">
  <div class="row"><button class="btn" id="start">Comenzar</button><button class="btn sec" id="showRank">Ver ranking</button></div>
</section>

<section id="game" class="card hide">
  <div class="top"><span id="prog"></span><span id="score"></span></div>
  <div class="bar"><div id="fill"></div></div>
  <div class="ico" id="ico"></div>
  <span class="cat" id="cat"></span>
  <h2 id="q"></h2>
  <div id="opts"></div>
  <div class="exp" id="exp"></div>
  <div class="row"><button class="btn hide" id="next">Siguiente</button></div>
</section>

<section id="end" class="card hide">
  <h2 id="who"></h2>
  <div class="big" id="final"></div>
  <p id="msg"></p>
  <h2 id="rkt">🏆 Ranking</h2>
  <ol id="rank"></ol>
  <div class="row"><button class="btn" id="again">Nuevo participante</button></div>
</section>

<section id="rankOnly" class="card hide">
  <h2>🏆 Ranking</h2>
  <h3>🟢 Fácil</h3><ol id="rank2"></ol><h3>🔴 Difícil</h3><ol id="rank3"></ol>
  <div class="row"><button class="btn sec" id="back">Volver</button><button class="btn sec" id="reset">Borrar ranking</button></div>
</section>
</main>

["Ciberseguridad","¿Cuál de estos algoritmos de cifrado es asimétrico?","RSA",["AES","DES","Blowfish"],"Usa un par de claves: pública y privada."],
["Ciberseguridad","¿Qué función hash se considera criptográficamente rota?","MD5",["SHA-256","SHA-3","bcrypt"],"Se pueden generar colisiones con facilidad."],
["Ciberseguridad","¿En qué consiste un ataque DDoS?","Saturar un servicio con tráfico desde muchas fuentes",["Robar contraseñas por correo","Cifrar archivos para pedir rescate","Escuchar una red Wi-Fi"],"Busca dejar el servicio inaccesible."],
["IA","¿Qué arquitectura introdujo el mecanismo de atención y es base de los LLM actuales?","Transformer",["Red convolucional (CNN)","Perceptrón simple","Máquina de Boltzmann"],"Se presentó en el artículo Attention Is All You Need (2017)."],
["IA","¿Cómo se llama el algoritmo que calcula gradientes hacia atrás para entrenar redes neuronales?","Retropropagación (backpropagation)",["Descenso por clustering","Validación cruzada","Búsqueda en anchura"],"Aplica la regla de la cadena capa por capa."],
["IA","¿En qué consiste el aprendizaje por refuerzo?","Un agente aprende por recompensas al interactuar con un entorno",["Aprender solo con datos etiquetados","Agrupar datos sin etiquetas","Memorizar todo el conjunto de datos"],"AlphaGo es un ejemplo famoso."],
["IA","¿Qué técnica reduce el sobreajuste apagando neuronas al azar durante el entrenamiento?","Dropout",["Batch normalization","Early stopping","Data augmentation"],"Fuerza a la red a no depender de neuronas concretas."],
["Sistemas","¿Qué es un interbloqueo (deadlock)?","Procesos que esperan recursos retenidos por otros y ninguno avanza",["Un proceso que usa toda la CPU","Una pérdida de memoria","Un error de compilación"],"Requiere espera circular, exclusión mutua, retención y no apropiación."],
["Sistemas","¿Qué kernel creó Linus Torvalds en 1991?","Linux",["Darwin","NT","Minix"],"Hoy impulsa servidores, Android y supercomputadoras."],
["Sistemas","¿Qué tecnología permite ejecutar varios sistemas operativos aislados en un mismo hardware?","Virtualización",["Multitarea cooperativa","Paginación","Overclocking"],"La gestiona un hipervisor como KVM o Hyper-V."]
]};
const CI={"Hardware":15,"Internet":10,"Programación":8,"Ciberseguridad":16,"IA":17,"Sistemas":9,"Algoritmos":14};
ICONS.push('<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="46" fill="none" stroke="#a78bfa" stroke-width="4"/><text x="60" y="80" font-size="54" font-weight="800" text-anchor="middle" fill="#fff" font-family="serif">∑</text></svg>');
ICONS.push('<svg viewBox="0 0 120 120"><rect x="34" y="34" width="52" height="52" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="4"/><rect x="48" y="48" width="24" height="24" fill="#22d3ee"/><path d="M44 20v14M60 20v14M76 20v14M44 86v14M60 86v14M76 86v14M20 44h14M20 60h14M20 76h14M86 44h14M86 60h14M86 76h14" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/></svg>','<svg viewBox="0 0 120 120"><rect x="30" y="52" width="60" height="46" rx="8" fill="#4ade80"/><path d="M42 52V40a18 18 0 0 1 36 0v12" fill="none" stroke="#4ade80" stroke-width="7"/><circle cx="60" cy="72" r="7" fill="#052e16"/><rect x="57" y="74" width="6" height="14" fill="#052e16"/></svg>','<svg viewBox="0 0 120 120"><path d="M25 35L60 25L95 35M25 35L60 60L95 35M25 85L60 60L95 85M25 85L60 95L95 85M25 35V85M95 35V85M60 25V95" stroke="#a78bfa" stroke-width="3" fill="none"/><g fill="#22d3ee"><circle cx="25" cy="35" r="9"/><circle cx="60" cy="25" r="9"/><circle cx="95" cy="35" r="9"/><circle cx="60" cy="60" r="11"/><circle cx="25" cy="85" r="9"/><circle cx="95" cy="85" r="9"/><circle cx="60" cy="95" r="9"/></g></svg>');
const LN={facil:"🟢 Fácil",dificil:"🔴 Difícil"};
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const show=id=>["home","game","end","rankOnly"].forEach(s=>$(s).classList.toggle("hide",s!==id));
let T=20,level="facil",qs,i,score,right,left,timer,name;

function load(l){try{return JSON.parse(localStorage.getItem("trivia_rank_"+l)||"[]")}catch(e){return (window._rk&&window._rk[l])||[]}}
function save(l,r){window._rk=window._rk||{};window._rk[l]=r;try{localStorage.setItem("trivia_rank_"+l,JSON.stringify(r))}catch(e){}}
function paintRank(el,l){const r=load(l);el.innerHTML=r.length?r.map(x=>`<li><b></b> — ${x.s} pts (${x.c}/5)</li>`).join(""):"<li>Aún no hay participantes.</li>";
  el.querySelectorAll("b").forEach((b,k)=>b.textContent=r[k].n)}

document.querySelectorAll(".lv").forEach(b=>b.onclick=()=>{level=b.dataset.l;document.querySelectorAll(".lv").forEach(x=>x.classList.toggle("on",x===b))});
$("start").onclick=()=>{name=$("name").value.trim()||"Anónimo";T=level==="facil"?20:30;qs=shuffle(BANKS[level]).slice(0,5);i=0;score=0;right=0;show("game");ask()};
function ask(){
  const d=qs[i];$("prog").textContent=`${LN[level]} · Pregunta ${i+1} de 5`;$("score").textContent=`Puntos: ${score}`;
  $("cat").textContent=d[0];$("ico").innerHTML=ICONS[CI[d[0]]];$("q").textContent=d[1];$("exp").textContent="";$("next").classList.add("hide");
  $("opts").innerHTML="";
  shuffle([d[2],...d[3]]).forEach(t=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>answer(t,b);$("opts").appendChild(b)});
  left=T;const f=$("fill");f.style.transition="none";f.style.width="100%";void f.offsetWidth;f.style.transition="width 1s linear";
  clearInterval(timer);timer=setInterval(()=>{left--;f.style.width=(left/T*100)+"%";if(left<=0)answer(null)},1000);
}
function answer(t,btn){
  clearInterval(timer);const d=qs[i];
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.textContent===d[2])b.classList.add("ok")});
  if(t===d[2]){sOk();right++;score+=(level==="facil"?100:150)+Math.max(left,0)*5;$("exp").textContent="✅ ¡Correcto! "+d[4]}
  else{sBad();if(btn)btn.classList.add("bad");$("exp").textContent=(t===null?"⏰ Se acabó el tiempo. ":"❌ Incorrecto. ")+d[4]}
  $("score").textContent=`Puntos: ${score}`;
  $("next").textContent=i===4?"Ver resultado":"Siguiente";$("next").classList.remove("hide");
}
$("next").onclick=()=>{i++;i<5?ask():finish()};
function finish(){
  const r=load(level);r.push({n:name,s:score,c:right});r.sort((a,b)=>b.s-a.s);save(level,r.slice(0,10));
  $("who").textContent=`¡Bien hecho, ${name}!`;$("final").textContent=score+" pts";
  $("msg").textContent=`Nivel ${LN[level]}: acertaste ${right} de 5. `+(right>=5?"¡Eres un crack de la tecnología! 🚀":right>=4?"¡Muy buen nivel! 👏":right>=2?"Vas por buen camino, ¡sigue explorando! 🔭":"¡La tecnología se aprende preguntando! 🌱");
  $("rkt").textContent="🏆 Ranking "+LN[level];paintRank($("rank"),level);show("end");
}
$("again").onclick=()=>{$("name").value="";show("home")};
$("showRank").onclick=()=>{paintRank($("rank2"),"facil");paintRank($("rank3"),"dificil");show("rankOnly")};
$("back").onclick=()=>show("home");
$("reset").onclick=()=>{if(confirm("¿Borrar todo el ranking?")){save("facil",[]);save("dificil",[]);paintRank($("rank2"),"facil");paintRank($("rank3"),"dificil")}};
$("name").addEventListener("keydown",e=>{if(e.key==="Enter")$("start").click()});
</script>
</body>
</html>
